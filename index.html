<!-- ════════════════════════════════════════════════════
     FIREBASE SDK
════════════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp }             from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut as fbSignOut }
                                        from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
  import { getFirestore, doc, collection, getDocs, setDoc, deleteDoc, onSnapshot, query, orderBy }
                                        from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

  // ══════════════════════════════════════════════════
  // 🔥 FIREBASE CONFIG — mobilyikama projesi
  // ══════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey:            "AIzaSyAu-k0rtdPOgUDsU12c1tlWSZx24l47Pnw",
    authDomain:        "mobilyikama-20962.firebaseapp.com",
    projectId:         "mobilyikama-20962",
    storageBucket:     "mobilyikama-20962.firebasestorage.app",
    messagingSenderId: "1026049106759",
    appId:             "1:1026049106759:web:85760b73b7d8a2be50a262",
    measurementId:     "G-4LVJTXY0GQ"
  };
  // ══════════════════════════════════════════════════



  const app      = initializeApp(firebaseConfig);
  const auth     = getAuth(app);
  const db       = getFirestore(app);
  const provider = new GoogleAuthProvider();

  let currentUser = null;
  let unsubscribeListeners = [];

  // ── Global fonksiyonları window'a ata ──────────────
  window.signInWithGoogle = async () => {
    document.getElementById('loginLoading').classList.remove('hidden');
    document.getElementById('loginError').classList.add('hidden');
    document.getElementById('googleSignInBtn').classList.add('hidden');
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      document.getElementById('loginLoading').classList.add('hidden');
      document.getElementById('googleSignInBtn').classList.remove('hidden');
      const errEl = document.getElementById('loginError');
      errEl.textContent = 'Giriş başarısız: ' + (e.message || 'Bilinmeyen hata');
      errEl.classList.remove('hidden');
    }
  };

  window.signOut = async () => {
    try {
      // Tüm dinleyicileri kapat
      unsubscribeListeners.forEach(fn => fn());
      unsubscribeListeners = [];
      await fbSignOut(auth);
    } catch(e) {}
  };

  window.showMobileUserMenu = () => document.getElementById('mobileUserMenu').classList.remove('hidden');
  window.hideMobileUserMenu = () => document.getElementById('mobileUserMenu').classList.add('hidden');

  // ── Auth Durumu Değişimi ───────────────────────────
  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      setupUserUI(user);
      await initDB(user.uid);
      showApp();
      window.render();
    } else {
      currentUser = null;
      showLogin();
    }
  });

  function setupUserUI(user) {
    const name   = user.displayName || 'Kullanıcı';
    const email  = user.email || '';
    const photo  = user.photoURL;
    const initl  = name.charAt(0).toUpperCase();

    // Sidebar
    const sName  = document.getElementById('sidebarUserName');
    const sEmail = document.getElementById('sidebarUserEmail');
    const sAv    = document.getElementById('sidebarUserAvatar');
    if (sName)  sName.textContent  = name;
    if (sEmail) sEmail.textContent = email;
    if (sAv) {
      if (photo) {
        sAv.innerHTML = `<img src="${photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">`;
      } else {
        sAv.textContent = initl;
      }
    }

    // Mobile avatar
    const mAv = document.getElementById('mobileUserAvatar');
    if (mAv) {
      if (photo) {
        mAv.innerHTML = `<img src="${photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">`;
      } else {
        mAv.textContent = initl;
      }
    }

    // Mobile menu
    const mumAv = document.getElementById('mumAvatar');
    const mumN  = document.getElementById('mumName');
    const mumE  = document.getElementById('mumEmail');
    if (mumAv) {
      if (photo) {
        mumAv.innerHTML = `<img src="${photo}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" referrerpolicy="no-referrer">`;
      } else {
        mumAv.textContent = initl;
      }
    }
    if (mumN) mumN.textContent  = name;
    if (mumE) mumE.textContent  = email;
  }

  function showApp() {
    document.getElementById('loginScreen').classList.add('hidden');
    if (window.innerWidth > 860) {
      document.getElementById('desktopLayout').classList.remove('hidden');
      document.getElementById('app').classList.add('hidden');
    } else {
      document.getElementById('app').classList.remove('hidden');
      document.getElementById('desktopLayout').classList.add('hidden');
    }
    // Re-check on resize
    window.addEventListener('resize', () => {
      if (!currentUser) return;
      if (window.innerWidth > 860) {
        document.getElementById('desktopLayout').classList.remove('hidden');
        document.getElementById('app').classList.add('hidden');
      } else {
        document.getElementById('app').classList.remove('hidden');
        document.getElementById('desktopLayout').classList.add('hidden');
      }
      window.render();
    });
  }

  function showLogin() {
    document.getElementById('loginScreen').classList.remove('hidden');
    document.getElementById('desktopLayout').classList.add('hidden');
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginLoading').classList.add('hidden');
    document.getElementById('googleSignInBtn').classList.remove('hidden');
    document.getElementById('loginError').classList.add('hidden');
  }

  // ── Firestore DB Wrapper ───────────────────────────
  async function initDB(uid) {
    // Mevcut localStorage verilerini Firestore'a aktar (tek seferlik migrasyon)
    await migrateFromLocalStorage(uid);

    // Firestore'u window.DB'ye bağla
    window.DB = {
      _uid: uid,
      _db: db,

      _colRef: (col) => collection(db, 'users', uid, col),
      _docRef: (col, id) => doc(db, 'users', uid, col, id),

      getCustomers: async () => {
        const snap = await getDocs(collection(db, 'users', uid, 'customers'));
        return snap.docs.map(d => d.data()).sort((a,b) => new Date(b.createdAt||0)-new Date(a.createdAt||0));
      },
      getCustomerById: async (id) => {
        const snap = await getDocs(collection(db, 'users', uid, 'customers'));
        return snap.docs.find(d => d.id === id)?.data() || null;
      },
      saveCustomer: async (c) => {
        await setDoc(doc(db, 'users', uid, 'customers', c.id), c);
      },
      deleteCustomer: async (id) => {
        await deleteDoc(doc(db, 'users', uid, 'customers', id));
        // NOT: Eskiden burada müşteriye ait randevular da siliniyordu.
        // Fakat bu durum finans geçmişindeki (Kasa) gelirlerin de silinmesine yol açtığı için kaldırıldı.
        // Müşteri silinse bile geçmiş işlemler kasada kalmalı.
      },

      getAppointments: async () => {
        const snap = await getDocs(collection(db, 'users', uid, 'appointments'));
        return snap.docs.map(d => d.data()).sort((a,b) => new Date(b.date||0)-new Date(a.date||0));
      },
      getAppointmentById: async (id) => {
        const snap = await getDocs(collection(db, 'users', uid, 'appointments'));
        return snap.docs.find(d => d.id === id)?.data() || null;
      },
      saveAppointment: async (a) => {
        await setDoc(doc(db, 'users', uid, 'appointments', a.id), a);
      },
      deleteAppointment: async (id) => {
        await deleteDoc(doc(db, 'users', uid, 'appointments', id));
      },
      getByCustomer: async (cId) => {
        const all = await window.DB.getAppointments();
        return all.filter(a => a.customerId === cId);
      },

      getExpenses: async () => {
        const snap = await getDocs(collection(db, 'users', uid, 'expenses'));
        return snap.docs.map(d => d.data()).sort((a,b) => new Date(b.date||0)-new Date(a.date||0));
      },
      saveExpense: async (e) => {
        await setDoc(doc(db, 'users', uid, 'expenses', e.id), e);
      },
      deleteExpense: async (id) => {
        await deleteDoc(doc(db, 'users', uid, 'expenses', id));
      },
    };
  }

  // ── LocalStorage → Firestore Migrasyon ────────────
  async function migrateFromLocalStorage(uid) {
    const migKey = 'crm_migrated_' + uid;
    if (localStorage.getItem(migKey)) return; // Zaten yapıldı

    const collections = [
      { lsKey: 'crm2_customers',    fsCol: 'customers' },
      { lsKey: 'crm2_appointments', fsCol: 'appointments' },
      { lsKey: 'crm2_expenses',     fsCol: 'expenses' },
    ];

    let migrated = 0;
    for (const { lsKey, fsCol } of collections) {
      try {
        const data = JSON.parse(localStorage.getItem(lsKey) || '[]');
        for (const item of data) {
          if (item.id) {
            await setDoc(doc(db, 'users', uid, fsCol, item.id), item);
            migrated++;
          }
        }
      } catch(e) {}
    }

    localStorage.setItem(migKey, '1');
    if (migrated > 0) {
      console.log(`[CRM] ${migrated} kayıt localStorage'dan Firestore'a taşındı.`);
    }
  }
</script>

<script src="app.js"></script>
